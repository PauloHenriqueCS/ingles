name: Homologation

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: homologation-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Validate ──────────────────────────────────────────────────────────────
  validate:
    name: Validate (build + migrations structure + full suite)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Baseline oficial: 20260725120000. supabase/migrations/ so pode conter
      # os tres arquivos oficiais do baseline/seeds e futuras migrations com
      # timestamp posterior. Historico legado vive em supabase/migrations_legacy/
      # e nunca deve voltar para supabase/migrations/. Ver supabase/MIGRATIONS.md.
      - name: Validate supabase/migrations/ structure
        run: |
          set -euo pipefail
          cd supabase/migrations

          REQUIRED=(
            20260725120000_baseline_full_database.sql
            20260725120001_seed_reference_data.sql
            20260725120002_seed_ai_runtime_controls.sql
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo oficial ausente: supabase/migrations/$f"
              exit 1
            fi
          done

          BASELINE_TS=20260725120000
          declare -A seen
          shopt -s nullglob
          for f in *.sql; do
            ts="${f:0:14}"
            if ! [[ "$ts" =~ ^[0-9]{14}$ ]]; then
              echo "::error::Arquivo sem timestamp de 14 digitos no prefixo (deve estar em migrations_legacy/): $f"
              exit 1
            fi
            if [ "$ts" -lt "$BASELINE_TS" ]; then
              echo "::error::Arquivo com timestamp anterior ao baseline oficial ($BASELINE_TS): $f — migrations legadas pertencem a supabase/migrations_legacy/"
              exit 1
            fi
            if [ -n "${seen[$ts]:-}" ]; then
              echo "::error::Timestamp duplicado ($ts): ${seen[$ts]} e $f"
              exit 1
            fi
            seen[$ts]="$f"
          done

          echo "OK: $(ls *.sql | wc -l) arquivo(s) em supabase/migrations/, timestamps unicos, nenhum anterior ao baseline, os 3 oficiais presentes."

      # TEMPORÁRIO (desde 2026-07-25): a suíte completa (`npm test`) já
      # estava quebrada no HEAD de develop antes deste workflow existir —
      # 33 testes falhando em 15 arquivos, sem relação com migrations/schema
      # (run: https://github.com/PauloHenriqueCS/ingles/actions/runs/30162877016).
      # Por isso ela roda aqui só para visibilidade e NÃO bloqueia
      # apply-migrations. continue-on-error NÃO esconde a falha: o passo
      # fica marcado como falho no resumo do job e o passo seguinte grava um
      # aviso explícito. Remova o continue-on-error assim que a suíte for
      # corrigida.
      - name: Full test suite (non-blocking — temporary, see comment above)
        id: full_test_suite
        continue-on-error: true
        run: npm test

      - name: Record full test suite result
        if: always()
        run: |
          if [ "${{ steps.full_test_suite.outcome }}" = "failure" ]; then
            echo "::warning::npm test (suite completa) FALHOU — não bloqueante temporariamente (ver comentário no workflow). Corrija antes de remover a exceção."
            {
              echo "## ⚠️ Suíte completa de testes (npm test): FALHOU"
              echo "Não bloqueante nesta versão do workflow (temporário, ver comentário acima do passo em .github/workflows/homologation.yml)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Suíte completa de testes (npm test): passou" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. Apply migrations to Supabase homologation ────────────────────────────
  apply-migrations:
    name: Apply migrations (Supabase homologation)
    needs: [validate]
    runs-on: ubuntu-latest
    environment: homologation
    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD_HOMOLOG: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
          SUPABASE_PROJECT_REF_HOMOLOG: ${{ secrets.SUPABASE_PROJECT_REF_HOMOLOG }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD_HOMOLOG SUPABASE_PROJECT_REF_HOMOLOG; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Guard — project ref must be the homologation project
        env:
          SUPABASE_PROJECT_REF_HOMOLOG: ${{ secrets.SUPABASE_PROJECT_REF_HOMOLOG }}
        run: |
          if [ "$SUPABASE_PROJECT_REF_HOMOLOG" != "ahszqexfzpbirdlkmdci" ]; then
            echo "::error::SUPABASE_PROJECT_REF_HOMOLOG nao aponta para o projeto de homologacao esperado (ahszqexfzpbirdlkmdci). Abortando antes de qualquer link/push."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link Supabase project (homologation)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
          SUPABASE_PROJECT_REF_HOMOLOG: ${{ secrets.SUPABASE_PROJECT_REF_HOMOLOG }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF_HOMOLOG"

      - name: List remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
        run: supabase migration list

      # --include-all: paridade com deploy-production.yml. Os bancos são
      # compartilhados com ingles-dashboad, que aplica suas próprias migrations
      # (ex.: 20260812200000_debit_conversation_extra_credits) diretamente nos
      # remotos. Isso deixa migrations DESTE repo com timestamp anterior à maior
      # versão remota já aplicada — "out of order" — e um `db push` sem
      # --include-all as recusa. --include-all é a forma documentada e
      # não-destrutiva de aplicar as pendentes fora de ordem; cada migration
      # deste repo é idempotente/aditiva. Ver supabase/MIGRATIONS.md.
      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
        run: supabase db push --dry-run --include-all

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
        run: supabase db push --include-all

      - name: Confirm zero pending migrations after push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
        run: supabase db push --dry-run --include-all

  # ── 3. Build and deploy the application to the homologation Vercel project ──
  #
  # Vercel's own Git integration deploy is disabled repo-wide
  # (vercel.json → git.deploymentEnabled: false), which is why production
  # also deploys via an explicit Vercel CLI job (deploy-production.yml)
  # instead of relying on it. This job mirrors that exact pattern — same
  # CLI version, same pull/build/deploy/smoke-test shape — pointed at a
  # separate, homologation-only Vercel project via its own secrets, never
  # VERCEL_PROD_PROJECT_ID and never the production project.
  #
  # `needs: [apply-migrations]` (which itself needs `validate`) means this
  # job only runs after both succeed — no `if: always()` anywhere here, so
  # a failure in either earlier job blocks this one automatically.
  deploy-homologation:
    name: Deploy homologation (Vercel)
    needs: [apply-migrations]
    runs-on: ubuntu-latest
    environment: homologation
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_HOMOLOG_PROJECT_ID }}
      HOMOLOG_BASE_URL: ${{ secrets.HOMOLOG_BASE_URL }}
    steps:
      # ── Verify every required secret is present before touching Vercel.
      # HOMOLOG_BASE_URL is intentionally NOT required here: until an
      # official homologation alias/domain exists, smoke tests fall back to
      # the ephemeral deployment URL Vercel returns in the deploy step below.
      - name: Verify required secrets are present
        run: |
          missing=0
          check() {
            local internal_name="$1" secret_name="$2"
            local value="${!internal_name}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $secret_name (GitHub Environment: homologation)"
              missing=1
            fi
          }
          check VERCEL_TOKEN VERCEL_TOKEN
          check VERCEL_ORG_ID VERCEL_ORG_ID
          check VERCEL_PROJECT_ID VERCEL_HOMOLOG_PROJECT_ID
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more required secrets are missing from the 'homologation' GitHub Environment. Aborting before any external service is touched. See .github/workflows/homologation.yml for what to configure."
            exit 1
          fi

      # ── Guard — project ID must not be the production project. This is a
      # hard second line of defense on top of using a distinct secret name:
      # even if VERCEL_HOMOLOG_PROJECT_ID were ever misconfigured to the
      # same value as production's, this stops the deploy outright. ────────
      - name: Guard — project must not be production
        env:
          VERCEL_PROD_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_PROD_PROJECT_ID" ] && [ "$VERCEL_PROJECT_ID" = "$VERCEL_PROD_PROJECT_ID" ]; then
            echo "::error::VERCEL_HOMOLOG_PROJECT_ID matches VERCEL_PROD_PROJECT_ID. Refusing to deploy homologation into the production Vercel project."
            exit 1
          fi

      # ── Checkout the exact commit that landed on develop ─────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── Vercel CLI — same pinned version as deploy-production.yml ────────
      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      # ── Pull the homologation Vercel project config (creates/fills
      # .vercel/project.json from VERCEL_ORG_ID/VERCEL_PROJECT_ID above —
      # same non-interactive linking mechanism production uses, no manual
      # file writing needed). Same retry rationale as production: a
      # freshly rotated VERCEL_TOKEN can transiently fail right after
      # creation/rotation. ──────────────────────────────────────────────────
      - name: Pull Vercel project (homologation)
        run: |
          for attempt in 1 2 3; do
            if vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
              exit 0
            fi
            echo "vercel pull attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "vercel pull failed after 3 attempts"
          exit 1

      # ── Build. --prod here selects the homologation project's own
      # "Production" environment slot (its only real environment) — safe
      # only because this project is dedicated exclusively to homologation,
      # never the shared production app. ───────────────────────────────────
      - name: Vercel build
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # ── Deploy the prebuilt output and capture the resulting URL ─────────
      - name: Vercel deploy
        id: vercel_deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      # ── Alias to the official homologation domain, only if one is already
      # configured (HOMOLOG_BASE_URL). Skipped, not failed, otherwise — an
      # alias is an operational nicety, not a correctness requirement. ─────
      - name: Alias to homologation domain (if configured)
        if: env.HOMOLOG_BASE_URL != ''
        run: |
          host="${HOMOLOG_BASE_URL#https://}"
          host="${host#http://}"
          vercel alias set "${{ steps.vercel_deploy.outputs.deployment_url }}" "$host" --token="$VERCEL_TOKEN"

      # ── Smoke tests. Target the official alias if configured, otherwise
      # the ephemeral deployment URL from this same run. ───────────────────
      - name: Resolve smoke test target
        id: smoke_target
        run: |
          if [ -n "$HOMOLOG_BASE_URL" ]; then
            echo "url=$HOMOLOG_BASE_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.vercel_deploy.outputs.deployment_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test — /
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ steps.smoke_target.outputs.url }}/"

      - name: Smoke test — /api/config/public
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ steps.smoke_target.outputs.url }}/api/config/public"
