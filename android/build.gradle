// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Build outputs are redirected outside the OneDrive-synced project folder.
// OneDrive's real-time sync locks files under */build while Gradle is
// writing/deleting them, which surfaces as java.nio.file.AccessDeniedException
// on Windows (reproduced on `:clean` deleting android/build/reports). This
// does not change any source, package, or app configuration — only where
// intermediate/output files are written.
def orodimLocalBuildDir = new File(System.getenv('LOCALAPPDATA') ?: System.getProperty('java.io.tmpdir'), 'orodim-android-build')
rootProject.buildDir = new File(orodimLocalBuildDir, 'root')
subprojects {
    buildDir = new File(orodimLocalBuildDir, project.name)
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
